<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="description" content="Tally — a four-quadrant counter with persistent, on-device tallies and CSV export." />
  <meta name="theme-color" content="#0f172a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>Tally</title>
  <link
    rel="icon"
    href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2064%2064'%3E%3Crect%20width='64'%20height='64'%20rx='12'%20fill='%23f1f5f9'/%3E%3Crect%20x='4'%20y='4'%20width='26'%20height='26'%20rx='6'%20fill='%23b6545f'/%3E%3Crect%20x='34'%20y='4'%20width='26'%20height='26'%20rx='6'%20fill='%235c7a63'/%3E%3Crect%20x='4'%20y='34'%20width='26'%20height='26'%20rx='6'%20fill='%239a6e0d'/%3E%3Crect%20x='34'%20y='34'%20width='26'%20height='26'%20rx='6'%20fill='%234f6bb5'/%3E%3C/svg%3E"
  />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app">
    <header class="app-header">
      <h1>Tally</h1>
      <span class="hint" id="total-display" role="status">Total: 0</span>
    </header>

    <main class="grid" aria-label="Four quadrant tally counters">
      <div class="tile" data-quadrant="A">
        <button type="button" class="tile-hit" aria-label="Tally quadrant A">
          <span class="letter" aria-hidden="true">A</span>
          <span class="quadrant-name" aria-hidden="true"></span>
          <span class="count" role="status">0</span>
        </button>
        <button type="button" class="tile-decrement" aria-label="Undo last tap on quadrant A" title="Undo last tap">−</button>
      </div>

      <div class="tile" data-quadrant="B">
        <button type="button" class="tile-hit" aria-label="Tally quadrant B">
          <span class="letter" aria-hidden="true">B</span>
          <span class="quadrant-name" aria-hidden="true"></span>
          <span class="count" role="status">0</span>
        </button>
        <button type="button" class="tile-decrement" aria-label="Undo last tap on quadrant B" title="Undo last tap">−</button>
      </div>

      <div class="tile" data-quadrant="C">
        <button type="button" class="tile-hit" aria-label="Tally quadrant C">
          <span class="letter" aria-hidden="true">C</span>
          <span class="quadrant-name" aria-hidden="true"></span>
          <span class="count" role="status">0</span>
        </button>
        <button type="button" class="tile-decrement" aria-label="Undo last tap on quadrant C" title="Undo last tap">−</button>
      </div>

      <div class="tile" data-quadrant="D">
        <button type="button" class="tile-hit" aria-label="Tally quadrant D">
          <span class="letter" aria-hidden="true">D</span>
          <span class="quadrant-name" aria-hidden="true"></span>
          <span class="count" role="status">0</span>
        </button>
        <button type="button" class="tile-decrement" aria-label="Undo last tap on quadrant D" title="Undo last tap">−</button>
      </div>
    </main>

    <footer class="actions">
      <button type="button" class="icon-btn" id="settings-btn" aria-label="Configure quadrant names" title="Configure quadrant names">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
      </button>
      <button type="button" class="action-btn" id="reset-btn">Reset</button>
      <button type="button" class="action-btn action-btn-primary" id="report-btn">Generate Report</button>
    </footer>
  </div>

  <div class="modal" id="report-modal" hidden>
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="report-modal-title">
      <h2 id="report-modal-title">Report ready</h2>
      <p class="modal-note" id="report-modal-note"></p>
      <textarea id="report-text" readonly aria-label="CSV report contents"></textarea>
      <div class="modal-actions">
        <button type="button" class="action-btn" id="report-copy-btn">Copy CSV</button>
        <button type="button" class="action-btn" id="report-save-btn">Save CSV</button>
        <button type="button" class="action-btn action-btn-primary" id="report-done-btn">Done</button>
      </div>
    </div>
  </div>

  <div class="modal" id="settings-modal" hidden>
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="settings-modal-title">
      <h2 id="settings-modal-title">Quadrant names</h2>
      <p class="modal-note">Optional labels (up to 20 characters) shown on each tile and included in CSV exports. Saved on this device.</p>
      <div class="settings-list">
        <div class="settings-row">
          <span class="settings-letter" data-quadrant="A">A</span>
          <input type="text" id="name-input-a" maxlength="20" placeholder="e.g. Work" autocomplete="off" aria-label="Quadrant A name" />
        </div>
        <div class="settings-row">
          <span class="settings-letter" data-quadrant="B">B</span>
          <input type="text" id="name-input-b" maxlength="20" placeholder="e.g. Gym" autocomplete="off" aria-label="Quadrant B name" />
        </div>
        <div class="settings-row">
          <span class="settings-letter" data-quadrant="C">C</span>
          <input type="text" id="name-input-c" maxlength="20" placeholder="e.g. Home" autocomplete="off" aria-label="Quadrant C name" />
        </div>
        <div class="settings-row">
          <span class="settings-letter" data-quadrant="D">D</span>
          <input type="text" id="name-input-d" maxlength="20" placeholder="e.g. Errands" autocomplete="off" aria-label="Quadrant D name" />
        </div>
      </div>
      <div class="modal-actions">
        <button type="button" class="action-btn" id="settings-cancel-btn">Cancel</button>
        <button type="button" class="action-btn action-btn-primary" id="settings-save-btn">Save names</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
