<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="description" content="Tally — a four-quadrant counter with persistent, on-device tallies and CSV export." />
  <meta name="theme-color" content="#0f172a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>Tally</title>
  <link
    rel="icon"
    href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2064%2064'%3E%3Crect%20width='64'%20height='64'%20rx='12'%20fill='%23f1f5f9'/%3E%3Crect%20x='4'%20y='4'%20width='26'%20height='26'%20rx='6'%20fill='%233b82f6'/%3E%3Crect%20x='34'%20y='4'%20width='26'%20height='26'%20rx='6'%20fill='%2310b981'/%3E%3Crect%20x='4'%20y='34'%20width='26'%20height='26'%20rx='6'%20fill='%23f59e0b'/%3E%3Crect%20x='34'%20y='34'%20width='26'%20height='26'%20rx='6'%20fill='%23ef4444'/%3E%3C/svg%3E"
  />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app">
    <header class="app-header">
      <h1>Tally</h1>
      <span class="hint">Tap a quadrant to tally</span>
    </header>

    <main class="grid" aria-label="Four quadrant tally counters">
      <div class="tile" data-quadrant="A">
        <button type="button" class="tile-hit" aria-label="Tally quadrant A">
          <span class="letter" aria-hidden="true">A</span>
          <span class="count" role="status">0</span>
        </button>
        <button type="button" class="tile-decrement" aria-label="Undo last tap on quadrant A" title="Undo last tap">−</button>
      </div>

      <div class="tile" data-quadrant="B">
        <button type="button" class="tile-hit" aria-label="Tally quadrant B">
          <span class="letter" aria-hidden="true">B</span>
          <span class="count" role="status">0</span>
        </button>
        <button type="button" class="tile-decrement" aria-label="Undo last tap on quadrant B" title="Undo last tap">−</button>
      </div>

      <div class="tile" data-quadrant="C">
        <button type="button" class="tile-hit" aria-label="Tally quadrant C">
          <span class="letter" aria-hidden="true">C</span>
          <span class="count" role="status">0</span>
        </button>
        <button type="button" class="tile-decrement" aria-label="Undo last tap on quadrant C" title="Undo last tap">−</button>
      </div>

      <div class="tile" data-quadrant="D">
        <button type="button" class="tile-hit" aria-label="Tally quadrant D">
          <span class="letter" aria-hidden="true">D</span>
          <span class="count" role="status">0</span>
        </button>
        <button type="button" class="tile-decrement" aria-label="Undo last tap on quadrant D" title="Undo last tap">−</button>
      </div>
    </main>

    <footer class="actions">
      <button type="button" class="action-btn" id="reset-btn">Reset</button>
      <button type="button" class="action-btn action-btn-primary" id="report-btn">Generate Report</button>
    </footer>
  </div>

  <div class="report-modal" id="report-modal" hidden>
    <div class="report-modal-card" role="dialog" aria-modal="true" aria-labelledby="report-modal-title">
      <h2 id="report-modal-title">Report ready</h2>
      <p class="report-modal-note" id="report-modal-note"></p>
      <textarea id="report-text" readonly aria-label="CSV report contents"></textarea>
      <div class="report-modal-actions">
        <button type="button" class="action-btn" id="report-copy-btn">Copy CSV</button>
        <button type="button" class="action-btn" id="report-save-btn">Save CSV</button>
        <button type="button" class="action-btn action-btn-primary" id="report-done-btn">Done</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
